# Mises à jour de dépendances (#132).
#
# Groupées, pour ne pas noyer le dépôt sous une PR par paquet : une PR
# hebdomadaire par famille. Les montées MAJEURES restent seules — chacune peut
# casser quelque chose, et c'est la CI de SA PR qui doit le dire.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      developpement:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
