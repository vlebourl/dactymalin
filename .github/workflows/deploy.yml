# Le déploiement et sa notification sont gérés par le service de déploiement.
# Ce workflow suit seulement le résultat des vérifications de main.
name: Suivi des vérifications

on:
  workflow_run:
    workflows: [Vérifications]
    types: [completed]
    branches: [main]

concurrency:
  group: suivi-verifications-main
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  suivi:
    name: Mettre à jour l’alerte de vérifications
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      VERDICT: ${{ github.event.workflow_run.conclusion }}
      URL_EXECUTION: ${{ github.event.workflow_run.html_url }}
      TITRE: "main n'est pas déployée : vérifications rouges"
    steps:
      - name: Signaler le verdict du commit courant
        run: |
          set -euo pipefail
          MAIN=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          [ "$MAIN" = "$SHA" ] || exit 0
          OUVERTE=$(gh issue list --state open --search "in:title \"$TITRE\"" --json number,title \
            --jq 'map(select(.title == env.TITRE)) | .[0].number // empty')
          if [ "$VERDICT" = success ]; then
            if [ -n "$OUVERTE" ]; then
              gh issue close "$OUVERTE" --comment "Vérifications réussies sur \`${SHA:0:7}\`."
            fi
          else
            CORPS=$(printf 'Les vérifications de main ont échoué sur \`%s\`.\n\n- Exécution : %s\n' "${SHA:0:7}" "$URL_EXECUTION")
            if [ -n "$OUVERTE" ]; then
              gh issue comment "$OUVERTE" --body "$CORPS"
            else
              gh issue create --title "$TITRE" --label bug --body "$CORPS"
            fi
          fi
