# Le filet AVANT la fusion.
#
# Il existait un hook `pre-push` local, mais il ne s'exécute que sur `main` et
# seulement chez qui a pensé à `git config core.hooksPath .githooks`. Depuis que
# la connexion est obligatoire, la suite e2e exige une base : une vérification
# qui dépend du poste de chacun ne suffit plus.
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

# Une PR poussée trois fois de suite n'a pas besoin de trois exécutions : seule
# la dernière décide.
#
# Sur `main`, en revanche, on n'annule JAMAIS. Le déploiement attend le verdict
# de ces vérifications : une exécution annulée le fait se sauter, donc deux
# fusions rapprochées suffisaient à escamoter un déploiement en silence — c'est
# arrivé dès le premier jour, deux PR mergées à 27 secondes d'intervalle.
# Chaque commit de `main` a droit à son verdict.
concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verifier:
    name: Types, tests, e2e
    runs-on: ubuntu-latest

    # Postgres publié sur 55432 : c'est le port qu'attendent `npm run test:db`
    # et `playwright.config.ts` par défaut. Un seul endroit à changer.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tapeavecmoi
          POSTGRES_PASSWORD: tapeavecmoi
          POSTGRES_DB: tapeavecmoi
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U tapeavecmoi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tapeavecmoi:tapeavecmoi@localhost:55432/tapeavecmoi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Firefox et WebKit ne portent qu'une spec (le repli de détection de
      # disposition), mais c'est justement celle qui casse par navigateur.
      - name: Installer les navigateurs
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Migrer la base de test
        run: npm run db:migrate

      - name: Types
        run: npx tsc --noEmit

      - name: Tests unitaires
        run: npx vitest run

      - name: Tests serveur (avec base)
        run: npm run test:db

      # La connexion est obligatoire : sans base ni API, aucun parcours
      # n'atteint la leçon. C'est `playwright.config.ts` qui démarre les deux.
      - name: Tests de bout en bout
        run: npx playwright test

      - name: Build de production
        run: npm run build

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
